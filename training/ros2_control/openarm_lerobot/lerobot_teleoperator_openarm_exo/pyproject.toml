[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_openarm_exo"
version = "0.1.0"
description = "LeRobot teleoperator plugin: Qnbot exoskeleton for OpenArm (via openarm_lerobot_bridge)"
requires-python = ">=3.12"
dependencies = ["lerobot"]

[tool.setuptools]
packages = ["lerobot_teleoperator_openarm_exo"]
